name: 'zh-CN build'

on:
  push:
    branches: ['zh-CN']
    tags: ['**']

concurrency:
  group: zh-cn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.ref_type == 'tag' ||
      contains(github.event.head_commit.message, '[build]')
    permissions:
      contents: write
    runs-on: windows-2025-vs2026
    env:
      # CustomBuildTool defaults to 0.0 outside the upstream release service.
      # Keep these aligned with the major/minor version used by upstream master.
      BUILD_MAJORVERSION: '4'
      BUILD_MINORVERSION: '0'

    steps:
    - name: Checkout repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3

    - name: Verify Python
      shell: pwsh
      run: python --version

    - name: Test localization tool
      shell: pwsh
      run: python -m unittest discover -s tools/localization/tests -v

    - name: Check upstream source contexts
      shell: pwsh
      run: |
        python tools/localization/localize.py check --state source
        python tools/localization/localize.py audit

    - name: Apply Simplified Chinese localization
      shell: pwsh
      run: python tools/localization/localize.py apply

    - name: Verify translated source and whitespace
      shell: pwsh
      run: |
        python tools/localization/localize.py check --state translated
        git diff --check

    - name: NuGet cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # 5.0.5
      with:
        path: |
          packages
          ~\.nuget\packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config', '**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json', '**/NuGet.Config', '**/global.json') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Restore NuGet packages
      shell: cmd
      working-directory: ${{ github.workspace }}
      run: nuget restore .\packages.config -PackagesDirectory .\packages\

    - name: Build tools cache
      id: custombuildtool-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # 5.0.5
      with:
        path: tools/CustomBuildTool/bin/Release/**
        key: custombuildtool-${{ runner.os }}-${{ hashFiles('tools/CustomBuildTool/**', '!tools/CustomBuildTool/bin/**') }}
        restore-keys: custombuildtool-${{ runner.os }}-

    - name: Third-party cache
      id: thirdparty-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # 5.0.5
      with:
        path: tools/thirdparty/**
        key: thirdparty-${{ runner.os }}-${{ hashFiles('tools/thirdparty/**', '!tools/thirdparty/bin/**') }}
        restore-keys: thirdparty-${{ runner.os }}-

    - name: Initialize build environment
      if: steps.custombuildtool-cache.outputs.cache-hit != 'true' || steps.thirdparty-cache.outputs.cache-hit != 'true'
      shell: cmd
      working-directory: ${{ github.workspace }}
      run: build\build_init.cmd

    - name: Build x64 portable package
      if: github.ref_type != 'tag'
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        $buildTool = Join-Path $env:GITHUB_WORKSPACE "tools/CustomBuildTool/bin/Release/$env:PROCESSOR_ARCHITECTURE/CustomBuildTool.exe"
        & $buildTool -bin --x64-only
        if ($LASTEXITCODE -ne 0) {
          throw "Portable build failed with exit code $LASTEXITCODE."
        }

    - name: Build tagged x64 release
      if: github.ref_type == 'tag'
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        $buildTool = Join-Path $env:GITHUB_WORKSPACE "tools/CustomBuildTool/bin/Release/$env:PROCESSOR_ARCHITECTURE/CustomBuildTool.exe"
        & $buildTool -release --x64-only
        if ($LASTEXITCODE -ne 0) {
          throw "Tagged x64 release build failed with exit code $LASTEXITCODE."
        }

    - name: Prepare x64 portable artifact
      if: github.ref_type != 'tag'
      shell: pwsh
      run: |
        $portableArchive = Join-Path $env:GITHUB_WORKSPACE 'build/output/systeminformer-build-win64-bin.zip'
        $portableDirectory = Join-Path $env:RUNNER_TEMP 'systeminformer-zh-CN-win64-portable'
        New-Item -ItemType Directory -Path $portableDirectory -Force | Out-Null
        Expand-Archive -LiteralPath $portableArchive -DestinationPath $portableDirectory -Force

    - name: Upload portable test package
      if: github.ref_type != 'tag'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
      with:
        name: systeminformer-zh-CN-win64-portable-${{ github.sha }}
        path: ${{ runner.temp }}/systeminformer-zh-CN-win64-portable/**
        if-no-files-found: error
        retention-days: 1

    - name: Prepare tagged release
      if: github.ref_type == 'tag'
      id: release
      shell: pwsh
      run: |
        $setupPath = Join-Path $env:GITHUB_WORKSPACE 'build/output/systeminformer-build-release-setup.exe'
        $fileVersion = (Get-Item -LiteralPath $setupPath).VersionInfo.FileVersion
        $versionMatch = [regex]::Match($fileVersion, '\d+\.\d+\.\d+\.\d+')
        if (-not $versionMatch.Success) {
          throw "Unable to determine the four-part version from '$fileVersion'."
        }

        "version=$($versionMatch.Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Authenticode-sign installer when a certificate is configured
      if: github.ref_type == 'tag'
      shell: pwsh
      env:
        WINDOWS_CODESIGN_CERTIFICATE_B64: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_B64 }}
        WINDOWS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_B64)) {
          Write-Warning 'No code-signing certificate is configured; the installer will be published unsigned.'
          return
        }

        $certificatePath = Join-Path $env:RUNNER_TEMP 'systeminformer-codesign.pfx'
        try {
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERTIFICATE_B64)
          )
          signtool sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD build/output/systeminformer-build-release-setup.exe
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed with exit code $LASTEXITCODE."
          }
        }
        finally {
          Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
        }

    - name: Create package checksums
      if: github.ref_type == 'tag'
      shell: pwsh
      run: |
        $files = @(
          'build/output/systeminformer-build-release-setup.exe'
          'build/output/systeminformer-build-win64-bin.zip'
        )
        $lines = foreach ($file in $files) {
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
          "$hash  $([IO.Path]::GetFileName($file))"
        }
        $lines | Out-File -FilePath 'build/output/systeminformer-zh-CN-SHA256SUMS.txt' -Encoding ascii

    - name: Create signed updater metadata
      if: github.ref_type == 'tag'
      shell: pwsh
      env:
        UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_PRIVATE_KEY_B64)) {
          throw 'The UPDATE_SIGNING_PRIVATE_KEY_B64 repository secret is required for tagged releases.'
        }

        $escapedTag = [Uri]::EscapeDataString('${{ github.ref_name }}')
        $metadataArgs = @{
          SetupPath = 'build/output/systeminformer-build-release-setup.exe'
          OutputPath = 'build/output/systeminformer-update.json'
          Version = '${{ steps.release.outputs.version }}'
          Commit = '${{ github.sha }}'
          SetupUrl = "https://github.com/AnLifeX/systeminformer/releases/download/$escapedTag/systeminformer-build-release-setup.exe"
          PrivateKeyBase64 = $env:UPDATE_SIGNING_PRIVATE_KEY_B64
        }
        ./tools/localization/New-UpdateMetadata.ps1 @metadataArgs

    - name: Publish GitHub release
      if: github.ref_type == 'tag'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $assets = @(
          'build/output/systeminformer-build-release-setup.exe'
          'build/output/systeminformer-build-win64-bin.zip'
          'build/output/systeminformer-zh-CN-SHA256SUMS.txt'
          'build/output/systeminformer-update.json'
        )
        gh release create '${{ github.ref_name }}' --repo '${{ github.repository }}' --verify-tag --title "System Informer ${{ steps.release.outputs.version }} 简体中文版" --generate-notes @assets
